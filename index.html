<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B-R-T Group WiFi</title>
  <style>
    body{font-family:Arial,sans-serif;background:linear-gradient(160deg,#e8f0f7,#f7fafc);color:#0f3a5f;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
    .box{background:#fff;padding:24px;border-radius:16px;width:90%;max-width:360px;box-shadow:0 8px 30px rgba(15,58,95,.15);text-align:center}
    .logo{max-width:220px;width:100%;height:auto;margin-bottom:6px}
    h2{margin:8px 0 4px;font-size:20px}
    p.sub{margin:0 0 12px;color:#5b7690;font-size:14px}
    input,button{width:100%;padding:13px;margin-top:10px;border-radius:10px;font-size:16px;box-sizing:border-box}
    input{border:1px solid #c9d6e2;background:#f8fbfd;color:#0f3a5f}
    input:focus{outline:2px solid #1aa6b7;border-color:#1aa6b7}
    button{border:0;background:linear-gradient(90deg,#0f3a5f,#1aa6b7);color:#fff;font-weight:bold}
    #err{color:#d63031;margin-top:10px;font-size:14px}
    .note{margin-top:16px;font-size:13px;color:#5b7690}
  </style>
</head>
<body>
  <div class="box">
    <img class="logo" src="logo.png" alt="B-R-T Group">
    <h2>Connect to WiFi</h2>
    <p class="sub">Enter your voucher code to get online</p>
    <input id="u" placeholder="Voucher code / username">
    <input id="p" type="password" placeholder="Password (if any)">
    <button onclick="login()">Login</button>
    <div id="err"></div>
    <div class="note">Need a voucher? Buy one at the shop.<br><a href="http://10.10.10.251:3000" style="color:#1aa6b7">Check my data usage</a></div>
  </div>

<script>
  const q = new URLSearchParams(location.search);
  const loginUrl = q.get('link-login-only') || 'http://10.10.10.1/login';
  const orig = q.get('link-orig') || 'http://example.com';
  if (q.get('error')) document.getElementById('err').textContent = q.get('error');

  function login(){
    const u = document.getElementById('u').value.trim();
    const p = document.getElementById('p').value || u;
    location.href = loginUrl + '?username=' + encodeURIComponent(u) +
                    '&password=' + encodeURIComponent(p) +
                    '&dst=' + encodeURIComponent(orig);
  }
</script>
</body>
</html>
