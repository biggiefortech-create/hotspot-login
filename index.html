<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WiFi Login</title>
  <style>
    body{font-family:sans-serif;background:#111;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
    .box{background:#1e1e1e;padding:24px;border-radius:12px;width:90%;max-width:340px}
    input,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:0;font-size:16px;box-sizing:border-box}
    button{background:#00b894;color:#fff;font-weight:bold}
    #err{color:#ff7675;margin-top:10px}
  </style>
</head>
<body>
  <div class="box">
    <h2>Connect to WiFi</h2>
    <input id="u" placeholder="Voucher code / username">
    <input id="p" type="password" placeholder="Password (if any)">
    <button onclick="login()">Login</button>
    <div id="err"></div>
  </div>

<script>
  const q = new URLSearchParams(location.search);
  const loginUrl = q.get('link-login-only') || 'http://10.10.10.1/login';
  const orig = q.get('link-orig') || 'http://example.com';
  if (q.get('error')) document.getElementById('err').textContent = q.get('error');

  function login(){
    const u = document.getElementById('u').value.trim();
    const p = document.getElementById('p').value || u;
    location.href = loginUrl + '?username=' + encodeURIComponent(u) +
                    '&password=' + encodeURIComponent(p) +
                    '&dst=' + encodeURIComponent(orig);
  }
</script>
</body>
</html>
